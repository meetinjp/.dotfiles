# starship — fast cross-shell prompt.
# Reference: https://starship.rs/config
#
# Two-line, framed prompt. All glyphs are plain Unicode (box-drawing +
# arrows), so the prompt renders correctly even without a Nerd Font.
# Colors use named ANSI so the prompt tracks your terminal's theme.

add_newline = true

format = """
[╭─](#b8bb26) $directory$git_branch$git_status$nodejs$rust$python$cmd_duration
[╰─](#b8bb26)$character """

[character]
success_symbol = "[❯](#b8bb26)"
error_symbol   = "[❯](#fb4934)"
vimcmd_symbol  = "[❮](#fabd2f)"

[directory]
style              = "bold #83a598"
truncation_length  = 3
truncate_to_repo   = true
truncation_symbol  = "…/"
format             = "in [$path]($style) "

[git_branch]
style  = "bold #d3869b"
format = "on [$branch]($style) "

[git_status]
style      = "bold #fabd2f"
format     = '([$all_status$ahead_behind]($style) )'
ahead      = "⇡${count}"
behind     = "⇣${count}"
diverged   = "⇕⇡${ahead_count}⇣${behind_count}"
modified   = "!"
staged     = "+"
untracked  = "?"
stashed    = "*"
conflicted = "✘"
renamed    = "»"
deleted    = "✘"

[cmd_duration]
min_time = 1000
style    = "italic #fabd2f"
format   = "took [$duration]($style) "

[nodejs]
format   = "via [Node $version](bold #b8bb26) "
detect_extensions = ["js", "mjs", "cjs", "ts", "tsx", "jsx"]
detect_files      = ["package.json", ".nvmrc"]

[rust]
format = "via [Rust $version](bold #fe8019) "

[python]
format = "via [Py $version](bold #fabd2f) "
