# Ghostty — macOS override layer.
#
# Loaded ONLY on macOS, and AFTER the shared ~/.config/ghostty/config, via an
# include line that install.sh writes into
#   ~/Library/Application Support/com.mitchellh.ghostty/config
# (which Ghostty reads after the XDG config). So everything here wins on macOS
# without touching the shared base config that Linux uses. On Linux this file
# is stowed but never included, so it stays inert.
#
# The base config's gtk-* / linux-cgroup* / window-decoration=server keys are
# simply ignored by Ghostty on macOS, so they need no removal here.

# ─── Native macOS chrome ─────────────────────────────────────────────────────
# macOS equivalents of the base config's gtk-titlebar-style = tabs etc.
macos-titlebar-style = tabs
window-decoration = auto
window-theme = auto

# ─── Quick terminal ──────────────────────────────────────────────────────────
# The base config binds global:super+grave_accent. On macOS `super` is ⌘, so
# that collides with the system ⌘+` "cycle windows" shortcut. Drop it and use a
# non-conflicting global. (Grant Ghostty Accessibility / Input Monitoring in
# System Settings > Privacy & Security for the global hotkey to fire.)
keybind = global:super+grave_accent=unbind
keybind = global:cmd+ctrl+grave_accent=toggle_quick_terminal

# ─── cmd-key idioms ──────────────────────────────────────────────────────────
# Native macOS muscle memory, alongside the ctrl+shift binds from the base
# config (which keep working). Later definitions win, so these are additive.
keybind = cmd+t=new_tab
keybind = cmd+w=close_surface
keybind = cmd+shift+w=close_window
keybind = cmd+shift+left_bracket=previous_tab
keybind = cmd+shift+right_bracket=next_tab
keybind = cmd+shift+enter=new_split:right
keybind = cmd+shift+d=new_split:down
keybind = cmd+1=goto_tab:1
keybind = cmd+2=goto_tab:2
keybind = cmd+3=goto_tab:3
keybind = cmd+4=goto_tab:4
keybind = cmd+5=goto_tab:5
keybind = cmd+6=goto_tab:6
keybind = cmd+7=goto_tab:7
keybind = cmd+8=goto_tab:8
keybind = cmd+9=goto_tab:9
