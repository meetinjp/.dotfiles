name: Configuration checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  ubuntu:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install check dependencies
        run: sudo apt-get update && sudo apt-get install -y stow shellcheck zsh unzip
      - name: Install the pinned rclone used by integration tests
        shell: bash
        run: |
          curl --fail --show-error --location --proto '=https' --tlsv1.2 \
            https://downloads.rclone.org/v1.76.0/rclone-v1.76.0-linux-amd64.zip -o "$RUNNER_TEMP/rclone.zip"
          printf '%s  %s\n' b00f00b3266c3764413afe599d3ec316f6f43b3e0ea8a0bc1d186d2133e46df7 "$RUNNER_TEMP/rclone.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/rclone.zip" -d "$RUNNER_TEMP/rclone"
          mkdir -p "$HOME/.local/bin"
          install -m755 "$RUNNER_TEMP/rclone/rclone-v1.76.0-linux-amd64/rclone" "$HOME/.local/bin/rclone"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Verify configuration and isolated installers
        run: ./scripts/check.sh
