# Per-distro WSL settings — lives INSIDE the distro at /etc/wsl.conf.
# Stow can't write to /etc, so install.sh skips this file; copy by hand:
#
#   sudo cp ~/.dotfiles/wsl/etc/wsl.conf /etc/wsl.conf
#   wsl.exe --shutdown    # then reopen the distro
#
# Companion file: wsl/.wslconfig (Windows host, global to all distros).

[boot]
systemd=true

# Match this to the user account that exists inside the distro. Ships
# as `meetinjp` (the maintainer's GitHub handle); edit before copying
# if your Linux user is different, or the distro will fail to attach.
[user]
default=meetinjp
