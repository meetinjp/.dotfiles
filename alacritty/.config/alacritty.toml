[font]
size = 16

[font.normal]
family = "FiraCode Nerd Font"
style = "Regular"

[font.bold]
family = "FiraCode Nerd Font"
style = "Bold"

[font.italic]
family = "FiraCode Nerd Font"
style = "Italic"

[font.bold_italic]
family = "FiraCode Nerd Font"
style = "Bold Italic"

[keyboard]
bindings = [
  { key = "Enter", mods = "Control|Shift", command = { program = "/bin/bash", args = [
    "-c",
    "~/.dotfiles/alacritty/spawn-alacritty-cwd.sh",
  ] } },
]
