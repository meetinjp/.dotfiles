general {
        output_format = "i3bar"
        colors = true
        interval = 5
}

order += "disk /home"
order += "battery all"
order += "tztime local"
order += "memory"

disk "/home" {
        format = "%avail"
}

battery all {
        format = "%status %percentage %remaining"
        format_down = "No battery"
        path = "/sys/class/power_supply/BAT%d/uevent"
        low_threshold = 10
}

tztime local {
        format = "%Y-%m-%d %H:%M:%S"
}

memory {
        format = "%used"
        threshold_degraded = "10%"
        format_degraded = "MEMORY: %free"
}
