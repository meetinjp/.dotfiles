################
### MONITORS ###
################

monitor = ,preferred,auto,1

###################
### MY PROGRAMS ###
###################

$terminal = wezterm
$fileManager = yazi
$menu = tofi-drun --drun-launch=true

#############################
### ENVIRONMENT VARIABLES ###
#############################

env = XCURSOR_SIZE,24
env = HYPRCURSOR_SIZE,24
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_QPA_PLATFORMTHEME,qt5ct

# Nvidia-only. Comment these out on AMD/Intel hosts — leaving them set
# makes mpv/firefox try to load a missing VAAPI/GLX driver.
env = LIBVA_DRIVER_NAME,nvidia
env = __GLX_VENDOR_LIBRARY_NAME,nvidia

#####################
### LOOK AND FEEL ###
#####################

general {
    gaps_in = 0
    gaps_out = 0
    border_size = 0
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    resize_on_border = false
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 0
    rounding_power = 0
    active_opacity = 1.0
    inactive_opacity = 1.0

    shadow {
        enabled = false
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = false
        size = 3
        passes = 1
        vibrancy = 0.1696
    }
}

# Beziers + animations are defined but every animation duration is 0,
# so the effect is "instant" — no motion, no flashes.
animations {
    enabled = yes, please :)

    bezier = easeOutQuint,0.23,1,0.32,1
    bezier = easeInOutCubic,0.65,0.05,0.36,1
    bezier = linear,0,0,1,1
    bezier = almostLinear,0.5,0.5,0.75,1.0
    bezier = quick,0.15,0,0.1,1

    animation = global, 0, 10, default
    animation = border, 0, 5.39, easeOutQuint
    animation = windows, 0, 4.79, easeOutQuint
    animation = windowsIn, 0, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 0, 1.49, linear, popin 87%
    animation = fadeIn, 0, 1.73, almostLinear
    animation = fadeOut, 0, 1.46, almostLinear
    animation = fade, 0, 3.03, quick
    animation = layers, 0, 3.81, easeOutQuint
    animation = layersIn, 0, 4, easeOutQuint, fade
    animation = layersOut, 0, 1.5, linear, fade
    animation = fadeLayersIn, 0, 1.79, almostLinear
    animation = fadeLayersOut, 0, 1.39, almostLinear
    animation = workspaces, 0, 1.94, almostLinear, fade
    animation = workspacesIn, 0, 1.21, almostLinear, fade
    animation = workspacesOut, 0, 1.94, almostLinear, fade
}

dwindle {
    pseudotile = true
    preserve_split = true
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
}

group:groupbar {
    render_titles = false
    rounding = 0
    gradient_rounding = 0
    gaps_in = 2
    gaps_out = 2
}

#############
### INPUT ###
#############

input {
    kb_layout = pl,gr
    kb_variant = ,polytonic
    # Caps Lock -> Ctrl is handled OS-level by keyd (see setup.sh).
    kb_options = grp:win_space_toggle

    follow_mouse = 0
    sensitivity = 0

    touchpad {
        natural_scroll = true
    }
}

device {
    name = epic-mouse-v1
    sensitivity = -0.5
}

device {
    name = xp-pen-g430s-pen
    output = eDP-1
}

###################
### KEYBINDINGS ###
###################

$mainMod = alt

bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, $terminal start -- $fileManager
bind = $mainMod, V, togglefloating,
bind = $mainMod, D, exec, $menu
bind = $mainMod, P, pseudo,
bind = $mainMod, J, togglesplit,

bind = $mainMod, F, fullscreen

bind = $mainMod, W, togglegroup
bind = $mainMod, T, changegroupactive, b
bind = $mainMod, N, changegroupactive, f

bind = $mainMod Shift, T, moveintogroup, l
bind = $mainMod Shift, N, moveintogroup, r

# Move focus, vim-style.
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# Switch workspaces with mainMod + [0-9].
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9].
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod SHIFT, LEFT, movecurrentworkspacetomonitor, +1
bind = $mainMod SHIFT, RIGHT, movecurrentworkspacetomonitor, -1

# Scratchpad.
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll-wheel workspace switching.
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB drag.
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys.
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 10%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-

# Media keys (requires playerctl).
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# Screenshot region (requires hyprshot).
bind = $mainMod, Print, exec, hyprshot -m region

# Cursor zoom in / out (uses jq for the float math, clamped to >= 1).
bind = $mainMod, equal, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '.float * 1.6')
bind = $mainMod, minus, exec, hyprctl -q keyword cursor:zoom_factor $(hyprctl getoption cursor:zoom_factor -j | jq '(.float * 0.625) | if . < 1 then 1 else . end')

#################
### AUTOSTART ###
#################

exec-once = waybar
exec-once = [workspace 1 silent] wezterm
exec-once = [workspace 2 silent] firefox
exec-once = systemctl --user start hyprpolkitagent
