# ~/.config/tmux/tmux.conf — personal tmux config (stowed from ~/.dotfiles/tmux)
#
# Prefix is C-a (screen heritage, popularized by Primeagen). All window/pane
# navigation lives under the prefix so nothing collides with Claude's vim
# keybindings or Ghostty's Ctrl/Ctrl+Shift+number tab/split bindings.

# ----- core ------------------------------------------------------------------

unbind C-b
set -g  prefix C-a
bind-key C-a send-prefix

set -g  default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"  # truecolor passthrough

# Ghostty-specific terminal features:
#   RGB         — true-color reporting
#   hyperlinks  — OSC 8 clickable URLs flow through tmux
#   clipboard   — OSC 52 clipboard, so yank-from-pane lands in host clipboard
#   title       — pane sets terminal title
#   extkeys     — kitty keyboard protocol / CSI u (proper Ctrl+Shift+key)
set -ga terminal-features ",ghostty*:RGB:hyperlinks:clipboard:title:extkeys"
# tmux 3.5+ derives the OSC 52 Ms capability from the `clipboard` feature
# flag above, so no explicit terminal-overrides for Ms is needed.

# Let apps inside tmux speak full OSC/sixel/Kitty graphics — needed for
# in-terminal image preview, lazygit OSC52 yanks, claude code's UI tricks.
set -g allow-passthrough on
set -g extended-keys on

set -s  escape-time 0          # no lag on <Esc> in vim
set -g  base-index 1           # windows count from 1
setw -g pane-base-index 1      # panes too
set -g  renumber-windows on    # close window 2 of 4 -> remaining renumber 1..3
set -g  history-limit 100000   # bigger scrollback for long agent streams
set -g  focus-events on
set -g  aggressive-resize on   # only resize panes the active client sees
set -g  detach-on-destroy off  # last window close -> detach, not kill
setw -g mode-keys vi
set -g  status-keys vi

# Multi-agent quiet — many panes streaming bells/activity is just noise.
set -g monitor-activity off
set -g monitor-bell     off
set -g visual-activity  off
set -g activity-action  none
set -g bell-action      none
set -g visual-bell      off

# ----- mouse -----------------------------------------------------------------

# Click status-bar window names to switch; scroll wheel enters copy mode;
# drag pane borders to resize; right-click panes for the tmux menu.
set -g mouse on

# Hold Shift to bypass tmux mouse handling — useful for native terminal
# text selection / link click-through.

# ----- navigation ------------------------------------------------------------

# Pane nav under prefix (vim hjkl). `-r` = repeatable without re-pressing prefix.
bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R

# Window nav under prefix. Plain h/l would shadow pane nav, so use C-h / C-l.
bind -r C-h previous-window
bind -r C-l next-window
bind -r Tab last-window

# Splits keep current pane's cwd.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# ----- copy mode -------------------------------------------------------------

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-no-clear
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-no-clear

# ----- reload ----------------------------------------------------------------

bind r source-file ~/.config/tmux/tmux.conf \; display 'tmux.conf reloaded'

# ----- status bar (Gruvbox Dark Hard) ----------------------------------------

set -g status-style 'bg=#3c3836 fg=#a89984'
set -g status-interval 5
setw -g window-status-format         " #I #W "
setw -g window-status-current-format "#[fg=#fe8019,bold] #I #W #[default]"
setw -g window-status-separator ""
set -g message-style 'bg=#3c3836 fg=#fe8019'
set -g pane-border-style 'fg=#3c3836'
set -g pane-active-border-style 'fg=#fe8019'
